{{- $secrets := .Values.secrets | default dict }}
{{- $appMysql := (.Values.applications | default dict).mysql | default dict }}
{{- $appEnv := ((.Values.applications | default dict).server | default dict).env | default dict }}
{{- if not $secrets.existingSecret }}
{{- /*
  Nothing is generated when secrets.existingSecret is set, so a Secret managed
  outside the chart (External Secrets, Sealed Secrets, SOPS, whatever) is left
  alone. That matters more than it looks: the generated Secret is named
  <release>-secrets, which is exactly the name most people give the one they
  manage themselves, so without this guard a sync would happily overwrite live
  credentials with whatever is in values.yaml.

  And when the chart does generate it, refuse to write the placeholders that
  ship in values.yaml. Rendering <ENTER_PASSWORD_HERE> into a real Secret is
  never what anyone meant, and it fails in a way that looks like a database
  problem rather than a configuration one.
*/}}
{{- $placeholders := list "<ENTER_PASSWORD_HERE>" "<ENTER_SECRET_HERE>" "" }}
{{- $required := dict
      "applications.mysql.password" ($appMysql.password | default "")
      "applications.server.env.ENCRYPTION_SECRET" ($appEnv.ENCRYPTION_SECRET | default "")
      "applications.server.env.ADMIN_PASSWORD" ($appEnv.ADMIN_PASSWORD | default "") }}
{{- range $path, $value := $required }}
{{- if has (toString $value) $placeholders }}
{{- fail (printf "\n\n%s is not set.\n\nEither give it a value, or set secrets.existingSecret to the name of a Secret you manage yourself holding DB_USER, DB_PASSWORD, ENCRYPTION_SECRET, ADMIN_USERNAME and ADMIN_PASSWORD.\n\nThe chart refuses to write the placeholder from values.yaml into a real Secret.\n" $path) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ansibleforms.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ansibleforms.server.labels" . | nindent 4 }}
  {{- with (include "ansibleforms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  DB_USER: {{ $appMysql.user | default "root" | b64enc }}
  DB_PASSWORD: {{ $appMysql.password | b64enc }}
  ENCRYPTION_SECRET: {{ $appEnv.ENCRYPTION_SECRET | b64enc }}
  ADMIN_USERNAME: {{ $appEnv.ADMIN_USERNAME | default "admin" | b64enc }}
  ADMIN_PASSWORD: {{ $appEnv.ADMIN_PASSWORD | b64enc }}
{{- end }}
