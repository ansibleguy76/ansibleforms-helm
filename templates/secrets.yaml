{{- $secrets := .Values.secrets | default dict }}
{{- $appMysql := (.Values.applications | default dict).mysql | default dict }}
{{- $appEnv := ((.Values.applications | default dict).server | default dict).env | default dict }}
{{- if not $secrets.existingSecret }}
{{- /*
  Nothing is generated when secrets.existingSecret is set, so a Secret managed
  outside the chart (External Secrets, Sealed Secrets, SOPS, whatever) is left
  alone. That matters more than it looks: the generated Secret is named
  <release>-secrets, which is exactly the name most people give the one they
  manage themselves, so without this guard a sync would happily overwrite live
  credentials with whatever is in values.yaml.
*/}}
{{- $generate := dig "generate" false $secrets }}
{{- /*
  Placeholders count as absent. With generate off they are refused, with it on
  they are filled in. Rendering <ENTER_PASSWORD_HERE> into a real Secret is
  never what anyone meant, and it fails later in a way that looks like a
  database problem rather than a configuration one.
*/}}
{{- $placeholders := list "<ENTER_PASSWORD_HERE>" "<ENTER_SECRET_HERE>" "" }}
{{- $given := dict }}
{{- range $key, $pair := dict
      "DB_PASSWORD" (list "applications.mysql.password" ($appMysql.password | default ""))
      "ENCRYPTION_SECRET" (list "applications.server.env.ENCRYPTION_SECRET" ($appEnv.ENCRYPTION_SECRET | default ""))
      "ADMIN_PASSWORD" (list "applications.server.env.ADMIN_PASSWORD" ($appEnv.ADMIN_PASSWORD | default "")) }}
{{- $path := index $pair 0 }}
{{- $value := toString (index $pair 1) }}
{{- if not (has $value $placeholders) }}
{{- $_ := set $given $key $value }}
{{- else if not $generate }}
{{- fail (printf "\n\n%s is not set.\n\nGive it a value, or set secrets.generate to true and the chart will make one up, or set secrets.existingSecret to the name of a Secret you manage yourself holding DB_USER, DB_PASSWORD, ENCRYPTION_SECRET, ADMIN_USERNAME and ADMIN_PASSWORD.\n\nThe chart refuses to write the placeholder from values.yaml into a real Secret.\n" $path) }}
{{- end }}
{{- end }}

{{- /*
  What is already in the cluster, so a value generated on the first install
  survives every upgrade afterwards. Without this every render would invent a
  new ENCRYPTION_SECRET, and that is not a password: it is the AES key the
  application encrypts stored credentials with. aes-256-ctr does not
  authenticate, so decrypting with the wrong key raises nothing at all and
  returns plausible-looking rubbish, which the application would then hand to a
  playbook as if it were a password.
*/}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "ansibleforms.secretName" .)) }}
{{- $existingData := (($existing).data) | default dict }}

{{- /*
  lookup returns nothing at all when there is no cluster to ask, which is what
  `helm template` does, and therefore what Argo CD and Flux do before they
  apply. Generating under those conditions would mint a new secret on every
  render and hand the application a key that no longer opens anything it wrote
  yesterday. Detected by asking for something that always exists.
*/}}
{{- $canLookUp := (lookup "v1" "Namespace" "" "kube-system") }}
{{- $missing := list }}
{{- range $key := (list "DB_PASSWORD" "ENCRYPTION_SECRET" "ADMIN_PASSWORD") }}
{{- if and (not (hasKey $given $key)) (not (hasKey $existingData $key)) }}
{{- $missing = append $missing $key }}
{{- end }}
{{- end }}
{{- if and $generate (not $canLookUp) $missing }}
{{- fail (printf "\n\nsecrets.generate is on, but this is being rendered without a cluster to read, so the chart cannot tell whether it has generated %s before.\n\nGenerating here would produce a different value on every render. For ENCRYPTION_SECRET that is not a password to reset: it is the AES key the application encrypts stored credentials with, and a new one silently turns them into rubbish rather than failing.\n\nThis is what `helm template` does, and so what Argo CD and Flux do before applying. For those, put the credentials in a Secret of their own and point secrets.existingSecret at it. External Secrets with Vault, Sealed Secrets and SOPS all fit here, and the chart will never touch that Secret.\n\nOtherwise supply the values, or install with helm directly, where the chart can see what it created last time.\n" (join ", " $missing)) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ansibleforms.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ansibleforms.server.labels" . | nindent 4 }}
  annotations:
    {{- /*
      Generated values live nowhere but here, so let helm uninstall leave it
      behind. Reinstalling then finds it again and the data encrypted with it
      stays readable. Delete it by hand when you really mean to start over.
    */}}
    {{- if $generate }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with (include "ansibleforms.annotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
type: Opaque
data:
  DB_USER: {{ $appMysql.user | default "root" | b64enc }}
  ADMIN_USERNAME: {{ $appEnv.ADMIN_USERNAME | default "admin" | b64enc }}
  {{- range $key := (list "DB_PASSWORD" "ENCRYPTION_SECRET" "ADMIN_PASSWORD") }}
  {{- if hasKey $given $key }}
  {{ $key }}: {{ index $given $key | b64enc }}
  {{- else if hasKey $existingData $key }}
  {{- /* Already base64 in the cluster, so it goes through untouched */}}
  {{ $key }}: {{ index $existingData $key }}
  {{- else }}
  {{- /*
    32 for ENCRYPTION_SECRET because the application uses it as an aes-256 key
    directly. Anything shorter is padded to 32 with a constant that is in its
    source code, so a ten character secret is ten characters of secret and
    twenty-two of public knowledge. Anything longer is cut to 32 and the rest
    never counts.
  */}}
  {{ $key }}: {{ randAlphaNum (ternary 32 24 (eq $key "ENCRYPTION_SECRET")) | b64enc }}
  {{- end }}
  {{- end }}
{{- end }}
