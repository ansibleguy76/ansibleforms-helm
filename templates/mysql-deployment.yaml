{{- if dig "enabled" true (.Values.mysql | default dict) }}
{{- /* Same Secret the server reads, generated by the chart or supplied */}}
{{- $secretName := include "ansibleforms.secretName" . }}
{{- $mysql := (.Values.containers.mysql | default dict) }}
{{- /*
  Everything below reads through dig or a default. It used to reach straight
  into .Values.containers.mysql.resources.limits.cpu, so leaving the resources
  block out of a values file failed the render with "nil pointer evaluating
  interface {}.limits" rather than falling back to anything. The server half of
  the chart already worked this way; this brings MySQL in line.
*/}}
{{- $resources := ($mysql.resources | default dict) }}
{{- $limits := ($resources.limits | default dict) }}
{{- $requests := ($resources.requests | default dict) }}
{{- $startup := ($mysql.startup | default dict) }}
{{- $readiness := ($mysql.readiness | default dict) }}
{{- $liveness := ($mysql.liveness | default dict) }}
{{- /*
  One command behind all three probes.

  mysqladmin ping exits 0 as soon as the server answers, and it answers with
  "access denied" long before it would answer a query, which is exactly the
  signal wanted here: the port is open and the server is talking. That also
  means no credentials are needed, so nothing has to put the root password on a
  command line where every `ps` in the container would show it.

  It matters that this is a real check rather than a TCP probe. The entrypoint
  brings up a temporary server on a socket with networking disabled while it
  initialises the data directory, so a plain port check would call MySQL ready
  minutes before it is.
*/}}
{{- $probe := ($mysql.probeCommand | default (list "sh" "-c" "mysqladmin ping -h 127.0.0.1 --protocol=TCP --silent")) }}
{{- include "ansibleforms.assertNoRootInitContainer" (dict "component" $mysql "key" "mysql") }}
{{- include "ansibleforms.assertSecurityContextsAgree" (dict "component" $mysql "key" "mysql") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "ansibleforms.mysql.fullname" . }}
  labels:
    {{- include "ansibleforms.mysql.labels" . | nindent 4 }}
  {{- with (include "ansibleforms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ansibleforms.mysql.selectorLabels" . | nindent 6 }}
  {{- /* Recreate, not RollingUpdate: two servers must never share one datadir */}}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "ansibleforms.mysql.labels" . | nindent 8 }}
        {{- with $mysql.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $podAnn := merge (dict) ($mysql.podAnnotations | default dict) (.Values.commonAnnotations | default dict) }}
      {{- with $podAnn }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $mysql.serviceAccountName | default "default" }}

      {{- with (include "ansibleforms.podScheduling" (dict "component" $mysql "root" $)) }}
      {{- . | nindent 6 }}
      {{- end }}

      {{- /*
        The image normally starts as root only to take ownership of the data
        directory before stepping down to uid 999. fsGroup in values asks the
        kubelet to do that instead, so the container never runs as root and the
        pod is accepted where the restricted Pod Security Standard is enforced.
      */}}
      {{- with $mysql.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with $mysql.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mysql
          image: {{ $mysql.image | required "containers.mysql.image is required" }}
          imagePullPolicy: {{ $mysql.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_PASSWORD
            {{- with $mysql.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with $mysql.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            limits:
              cpu: {{ $limits.cpu | default "1" }}
              memory: {{ $limits.memory | default "1024Mi" }}
            requests:
              cpu: {{ $requests.cpu | default "250m" }}
              memory: {{ $requests.memory | default "512Mi" }}

          {{- with $mysql.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          {{- /*
            The startup probe holds the other two back while the data directory
            is created and the init script runs, which on a first boot takes far
            longer than a healthy server ever will. failureThreshold times
            periodSeconds is the budget, 300s by default.
          */}}
          {{- if or (not (hasKey $startup "enabled")) $startup.enabled }}
          startupProbe:
            exec:
              command:
                {{- toYaml $probe | nindent 16 }}
            initialDelaySeconds: {{ $startup.initialDelaySeconds | default 10 }}
            periodSeconds: {{ $startup.periodSeconds | default 10 }}
            timeoutSeconds: {{ $startup.timeoutSeconds | default 5 }}
            failureThreshold: {{ $startup.failureThreshold | default 30 }}
          {{- end }}

          {{- /*
            Without this the Service advertised a ready endpoint as soon as the
            container started, while MySQL was still refusing connections, which
            on an empty data directory is a window of about ten seconds. It does
            not make the application start any sooner, since it retries anyway.
            What it changes is that readiness stops lying, so helm --wait, Argo
            CD health and anything else treating the database as a dependency
            are working from something true.
          */}}
          {{- if or (not (hasKey $readiness "enabled")) $readiness.enabled }}
          readinessProbe:
            exec:
              command:
                {{- toYaml $probe | nindent 16 }}
            initialDelaySeconds: {{ $readiness.initialDelaySeconds | default 5 }}
            periodSeconds: {{ $readiness.periodSeconds | default 10 }}
            timeoutSeconds: {{ $readiness.timeoutSeconds | default 5 }}
            failureThreshold: {{ $readiness.failureThreshold | default 3 }}
          {{- end }}

          {{- /*
            Deliberately slack. Restarting a database because it was busy is
            worse than leaving it alone, so this only fires after the server has
            been unreachable for failureThreshold times periodSeconds, 90s by
            default, and only once the startup probe has already succeeded.
          */}}
          {{- if or (not (hasKey $liveness "enabled")) $liveness.enabled }}
          livenessProbe:
            exec:
              command:
                {{- toYaml $probe | nindent 16 }}
            initialDelaySeconds: {{ $liveness.initialDelaySeconds | default 15 }}
            periodSeconds: {{ $liveness.periodSeconds | default 30 }}
            timeoutSeconds: {{ $liveness.timeoutSeconds | default 10 }}
            failureThreshold: {{ $liveness.failureThreshold | default 3 }}
          {{- end }}

          volumeMounts:
            - name: mysql-persistent-storage
              mountPath: /var/lib/mysql
            - name: my-cnf
              mountPath: /etc/mysql/my.cnf
              subPath: my.cnf
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
            {{- with $mysql.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      restartPolicy: Always
      volumes:
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: {{ include "ansibleforms.mysql.pvcName" . }}
        - name: my-cnf
          configMap:
            name: {{ include "ansibleforms.mysql.fullname" . }}-my-cnf
            items:
              - key: my.cnf
                path: my.cnf
        - name: init-script
          configMap:
            name: {{ include "ansibleforms.mysql.fullname" . }}-init
        {{- with $mysql.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
