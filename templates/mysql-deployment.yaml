{{- if dig "enabled" true (.Values.mysql | default dict) }}
{{- /* Same Secret the server reads, generated by the chart or supplied */}}
{{- $secretName := include "ansibleforms.secretName" . }}
{{- $mysql := (.Values.containers.mysql | default dict) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "ansibleforms.mysql.fullname" . }}
  labels:
    {{- include "ansibleforms.mysql.labels" . | nindent 4 }}
  {{- with (include "ansibleforms.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ansibleforms.mysql.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "ansibleforms.mysql.labels" . | nindent 8 }}
        {{- with $mysql.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- $podAnn := merge (dict) ($mysql.podAnnotations | default dict) (.Values.commonAnnotations | default dict) }}
      {{- with $podAnn }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $mysql.serviceAccountName | default "default" }}

      {{- with (include "ansibleforms.podScheduling" (dict "component" $mysql "root" $)) }}
      {{- . | nindent 6 }}
      {{- end }}
{{- if $mysql.initContainers }}
      initContainers:
{{- toYaml .Values.containers.mysql.initContainers | nindent 8 }}
{{- end }}
      containers:
        - image: {{ .Values.containers.mysql.image }}
          name: mysql
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_PASSWORD
          resources:
            limits:
              cpu: {{ .Values.containers.mysql.resources.limits.cpu }}
              memory: {{ .Values.containers.mysql.resources.limits.memory }}
            requests:
              cpu: {{ .Values.containers.mysql.resources.requests.cpu }}
              memory: {{ .Values.containers.mysql.resources.requests.memory }}
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: mysql-persistent-storage
            - name: my-cnf
              mountPath: /etc/mysql/my.cnf
              subPath: my.cnf
            - name: init-script # init script
              mountPath: /docker-entrypoint-initdb.d
      restartPolicy: Always
      volumes:
        - name: mysql-persistent-storage
          persistentVolumeClaim:
            claimName: {{ include "ansibleforms.mysql.pvcName" . }}
        - name: my-cnf
          configMap:
            name: {{ include "ansibleforms.mysql.fullname" . }}-my-cnf
            items:
            - key: my.cnf
              path: my.cnf
        - name: init-script
          configMap:
            name: {{ include "ansibleforms.mysql.fullname" . }}-init
{{- end }}
