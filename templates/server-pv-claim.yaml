{{- /* Normalise values so a missing key does not blow up the render */}}
{{- $server := .Values.storages.server | default dict -}}
{{- $static := $server.static | default dict -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ .Release.Name }}-server-pvc
  labels:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: {{ .Release.Name }}
spec:
  accessModes:
    - {{ $server.accessMode | default "ReadWriteMany" }}
  resources:
    requests:
      storage: {{ $server.size | default "10Gi" }}

  {{- if $static.enabled }}

  {{- /* Static volume: a PersistentVolume with this name is expected to exist */}}
  {{- if $static.storageClassName }}
  storageClassName: {{ $static.storageClassName }}
  {{- else }}
  storageClassName: ""
  {{- end }}
  volumeName: {{ default (printf "%s-server-pv" .Release.Name) $static.volumeName }}

  {{- else }}

  {{- /* Dynamic provisioning through a StorageClass (Longhorn, NFS CSI, ...) */}}
  {{- if $server.className }}
  storageClassName: {{ $server.className }}
  {{- end }}

  {{- end }}
