# ------------------------------------------------------------------------------
# NAMING
# ------------------------------------------------------------------------------
# Every resource is named after the release: <release>-server, <release>-mysql,
# <release>-secrets and so on. They used to be plain literals ("server",
# "mysql"), which meant two releases in one namespace overwrote each other's
# Deployments and each Service selected the other one's pods.
#
# nameOverride changes the app.kubernetes.io/name label, fullnameOverride
# replaces the release name as the prefix of every resource name. Both are
# optional and almost nobody needs them.
nameOverride: ''
fullnameOverride: ''

# ------------------------------------------------------------------------------
# LABELS AND ANNOTATIONS FOR EVERYTHING
# ------------------------------------------------------------------------------
# Added to every object the chart creates, and to both pods. Useful for cost
# tags, ownership, Argo CD tracking, backup selectors and the like.
#
# commonLabels never reach a Deployment's selector. A selector is immutable
# once the Deployment exists, so a label added there could never be changed or
# removed again, and an existing release would fail to upgrade outright.
commonLabels: {}
#   team: platform
#   cost-center: "4711"

commonAnnotations: {}
#   example.com/owner: platform@example.com

# ------------------------------------------------------------------------------
# PULLING THE IMAGES
# ------------------------------------------------------------------------------
# Secrets used to pull both images, for a private registry or a mirror. The
# Secrets have to exist in the release namespace already, the chart does not
# create them:
#
#   kubectl -n <namespace> create secret docker-registry regcred \
#     --docker-server=registry.example.com \
#     --docker-username=... --docker-password=...
#
# Override per component with containers.server.imagePullSecrets or
# containers.mysql.imagePullSecrets when the two images live in different
# registries.
imagePullSecrets: []
#   - name: regcred

# ------------------------------------------------------------------------------
# MYSQL DEPLOYMENT
# ------------------------------------------------------------------------------
# Whether the chart deploys its own MySQL. Turn it off to point AnsibleForms at
# a database you already run, and set applications.mysql.host and .port below to
# reach it. The Deployment, Service, PVC and the two ConfigMaps are then all
# skipped, so nothing has to be cleaned up afterwards.
#
# Careful with an existing release: disabling this deletes the MySQL PVC and,
# with a reclaim policy of Delete, the data along with it. Take a dump first.
mysql:
  enabled: true

  # The my.cnf of the bundled database. Mounted over /etc/mysql/my.cnf, which
  # replaces the file the image ships instead of adding to it. On the official
  # image that file is little more than an !includedir pointing at
  # /etc/mysql/conf.d, so what you give up is the ability to drop extra files
  # in there, not any tuning of its own.
  #
  # The default is the bare header the chart has always mounted. Anything under
  # [mysqld] goes here:
  #
  #   config: |
  #     [mysqld]
  #     max_allowed_packet = 64M
  #     character-set-server = utf8mb4
  #     collation-server = utf8mb4_unicode_ci
  #
  # Changing this does not restart the pod on its own. A ConfigMap update is
  # picked up on the next restart, so roll it yourself, or put a checksum in
  # containers.mysql.podAnnotations so Helm does it for you.
  config: |
    [mysqld]

applications:

  # MYSQL CONFIGURATION
  # user and password are the credentials AnsibleForms connects with, whether
  # the database is the bundled one or your own. Leave password out entirely if
  # you supply the credentials through secrets.existingSecret further down.
  mysql:
    password: <ENTER_PASSWORD_HERE>
    user: root
    # Defaults to the bundled service on "mysql":3306. Point these at your own
    # server when mysql.enabled is false.
    # host: "mysql"
    # port: "3306"

  # SERVER CONFIGURATION
  server:
    env:
      # -------- BASIC ENV VARIABLES REQUIRED --------
      HTTPS: 0 # Enables/Disables HTTP/HTTPS Ports 0 [(false) -> port: 80] [1 (true) -> port: 443]
      ADMIN_PASSWORD: <ENTER_PASSWORD_HERE>
      ADMIN_USERNAME: admin
      ENCRYPTION_SECRET: <ENTER_SECRET_HERE>

      # -------- EXTRA ENV VARIABLES FOR SERVER --------

      # ******** IGNORE PRIVATE CA CERTS ********
      # NODE_TLS_REJECT_UNAUTHORIZED: 0

      # ******** ENABLE THIS FOR PRIVATE CA CERTS ********
      # NODE_EXTRA_CA_CERTS: /etc/custom-certs/custom-ca.crt

# ------------------------------------------------------------------------------
# CONTAINERS CONFIGURATION
# ------------------------------------------------------------------------------
containers:

# ~~~~

  mysql:
    # ---------------------------------------------------
    # WHERE THIS POD IS ALLOWED TO RUN
    # ---------------------------------------------------
    # Plain Kubernetes, passed through as written. All optional and all empty
    # by default, so nothing changes unless you set them. The database is the
    # half that owns a volume, so this is usually the one that needs pinning
    # to whatever node its storage lives on.
    nodeSelector: {}
    #   kubernetes.io/hostname: node-1
    tolerations: []
    #   - key: node-role.kubernetes.io/control-plane
    #     operator: Exists
    #     effect: NoSchedule
    affinity: {}
    topologySpreadConstraints: []
    priorityClassName: ''
    # Extra labels and annotations on the pod only, on top of commonLabels.
    podLabels: {}
    podAnnotations: {}
    # Overrides the release wide imagePullSecrets for this image alone.
    imagePullSecrets: []
    # The chart does not create a ServiceAccount. Name one you manage yourself.
    serviceAccountName: ''

    # Pinned on purpose. A floating tag means an unattended major upgrade the
    # next time the pod is rescheduled, and MySQL does not support downgrades,
    # so a rollback would leave the data directory unreadable.
    # Already running a 9.x image? Set this to your current tag before upgrading.
    image: mysql:8.4
    imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: '2'
        memory: 2048Mi
      requests:
        cpu: '0.5'
        memory: 512Mi

    # ---------------------------------------------------
    # HEALTH CHECKS
    # ---------------------------------------------------
    # All three run the same command. mysqladmin ping exits 0 as soon as the
    # server answers, and it answers "access denied" long before it would answer
    # a query, which is the signal wanted here: the port is open and the server
    # is talking. No credentials are needed for that, so the root password never
    # reaches a command line where every ps in the container would show it.
    #
    # A plain TCP check would not do. While the data directory is being created
    # the entrypoint runs a temporary server on a socket with networking off, so
    # a port check calls MySQL ready long before it is.
    probeCommand: []
    #   - sh
    #   - -c
    #   - mysqladmin ping -h 127.0.0.1 --protocol=TCP --silent

    # Holds the other two back while the data directory is created and the init
    # script runs, which on a first boot takes far longer than a healthy server
    # ever will. failureThreshold x periodSeconds is the budget, 300s here.
    startup:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

    # Without this the Service advertised a ready endpoint the moment the
    # container started, while MySQL was still refusing connections. Measured on
    # an empty data directory that window is about ten seconds, and it grows
    # with the size of the volume and the init script.
    #
    # It does not make AnsibleForms start any faster. The server retries either
    # way, and it actually logs a few more "connect ECONNREFUSED" lines while
    # the Service has no endpoint at all. What changes is that everything which
    # reads readiness now tells the truth: helm --wait, Argo CD health, and
    # anything else that treats the database as a dependency.
    readiness:
      enabled: true
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    # Deliberately slack. Restarting a database because it was busy is worse
    # than leaving it alone, so this only fires after 90s of no answer, and only
    # once the startup probe has already succeeded. Set enabled to false if you
    # would rather it never restarted the database at all.
    liveness:
      enabled: true
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3

    # ---------------------------------------------------
    # EXTRAS, same shape as the server further down
    # ---------------------------------------------------
    extraEnv: []
    #   - name: MYSQL_INITDB_SKIP_TZINFO
    #     value: "1"
    extraEnvFrom: []
    extraVolumes: []
    extraVolumeMounts: []
    initContainers: []

    # ---------------------------------------------------
    # SECURITY CONTEXT
    # ---------------------------------------------------
    # These defaults satisfy the restricted Pod Security Standard, which several
    # managed distributions now enforce by default and which the chart used to
    # fail outright.
    #
    # The image normally starts as root only to take ownership of the data
    # directory and then steps down to uid 999. fsGroup makes the kubelet do
    # that instead, so the container never needs to be root at all.
    # OnRootMismatch means the ownership pass is skipped when the top of the
    # volume already looks right, which keeps a restart cheap on a large
    # database and leaves a volume from an older release alone: the old
    # entrypoint already chowned it to 999:999.
    #
    # To go back to no pod security context at all, which is what a volume on
    # NFS with root_squash may need, set the whole map to null. Not to {}: Helm
    # merges your values file over this one, and an empty map merges to exactly
    # what is written here. Only null removes a key.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 999
      runAsGroup: 999
      fsGroup: 999
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL

# ~~~~

  server:
    image: ansibleguy/ansibleforms:6.2.1
    replicas: 1

    # Accepts either "Recreate" / "RollingUpdate" or the Kubernetes shape
    # ({type: Recreate}). Recreate is the safer choice here: the server and the
    # persistent volume are shared, so two pods alive at once means two
    # schedulers and two seed runs against the same database.
    strategy: "RollingUpdate"

    # Written into the pod template, so changing them triggers a rollout. Handy
    # for a checksum annotation when the forms ConfigMap changes.
    podAnnotations: {}

    # Extra labels on the pod only, on top of commonLabels.
    podLabels: {}

    # ---------------------------------------------------
    # WHERE THIS POD IS ALLOWED TO RUN
    # ---------------------------------------------------
    # Plain Kubernetes, passed through as written. All optional and all empty
    # by default, so nothing changes unless you set them.
    nodeSelector: {}
    #   kubernetes.io/hostname: node-1
    tolerations: []
    #   - key: workload
    #     operator: Equal
    #     value: apps
    #     effect: NoSchedule
    affinity: {}
    #   nodeAffinity:
    #     requiredDuringSchedulingIgnoredDuringExecution:
    #       nodeSelectorTerms:
    #         - matchExpressions:
    #             - key: kubernetes.io/arch
    #               operator: In
    #               values: [amd64]
    topologySpreadConstraints: []
    priorityClassName: ''

    # Overrides the release wide imagePullSecrets for this image alone.
    imagePullSecrets: []

    # The chart does not create a ServiceAccount. Name one you manage yourself,
    # otherwise the namespace's "default" is used.
    serviceAccountName: ''

    # A terminal on a server process is not useful and keeps stdin open.
    stdin: false
    tty: false

    # The app listens on 80 or 443, both privileged, while the container runs
    # as an unprivileged user. A pod network namespace always starts with
    # net.ipv4.ip_unprivileged_port_start at 1024, whatever the node says, so
    # without this the process dies with "listen EACCES: permission denied".
    # The sysctl is on the kubelet's safe list and allowed under the restricted
    # pod security standard. Set it to false only if your kubelet refuses the
    # sysctl, and then serve the app on a port above 1024.
    bindPrivilegedPorts: true
    resources:
      limits:
        cpu: '4'
        memory: 4096Mi
      requests:
        cpu: '1'
        memory: 1024Mi
    # There used to be a "prepare-persistent-volume" init container here that ran
    # as root purely to chown the volume to 1000:1000. podSecurityContext.fsGroup
    # below now asks the kubelet to do the same thing, which is both cheaper and
    # the only way the pod can run where the restricted Pod Security Standard is
    # enforced: a container with runAsUser 0 is refused outright there.
    #
    # Put it back only if your storage ignores fsGroup, and know that doing so
    # gives up on the restricted standard.
    initContainers: []

    # ---------------------------------------------------
    # SECURITY CONTEXT
    # ---------------------------------------------------
    # Pod level, so it covers the container and anything you add to
    # initContainers. Together with the container level context the chart sets
    # further down, this is what makes the release installable in a namespace
    # with pod-security.kubernetes.io/enforce=restricted.
    #
    # sysctls are added by the chart when bindPrivilegedPorts is on, and are
    # left alone if you set your own here. net.ipv4.ip_unprivileged_port_start
    # is on the kubelet's safe list and is permitted under restricted, which is
    # what lets the application keep listening on 80 or 443.
    #
    # To go back to no pod security context at all, set the whole map to null.
    # Not to {}: Helm merges your values file over this one, and an empty map
    # merges to exactly what is written here. Only null removes a key.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

  # ------------------------------------------------------------------------------
  # LIVENESS / READINESS CONFIGURATION
  # ------------------------------------------------------------------------------

    # The startup probe covers the first boot, when the database migrations run
    # and the app can take minutes to answer. Until it succeeds the liveness
    # probe is not evaluated, which is what stops the restart loop people hit on
    # a fresh install. failureThreshold x periodSeconds is the budget, 300s here.
    startup:
      enabled: true
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30

    liveness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 15
      failureThreshold: 3
    readiness:
      path: /
      initialDelaySeconds: 15
      periodSeconds: 15
      timeoutSeconds: 15
      failureThreshold: 3

  # ---------------------------------------------------
  # EXTRA ENVIRONMENT
  # ---------------------------------------------------
  # Plain Kubernetes env entries, for anything applications.server.env cannot
  # express: a value read from another Secret or ConfigMap, or from the
  # downward API. Written after the generated variables, so it wins.
    extraEnv: []
    #   - name: ENV
    #     value: production
    #   - name: SOME_TOKEN
    #     valueFrom:
    #       secretKeyRef:
    #         name: my-other-secret
    #         key: token

  # Whole ConfigMaps or Secrets injected as environment at once.
    extraEnvFrom: []
    #   - configMapRef:
    #       name: ansibleforms-extra-config
    #   - secretRef:
    #       name: ansibleforms-extra-secrets

  # ---------------------------------------------------
  # ENABLE THIS FOR CUSTOM COMMANDS
  # ---------------------------------------------------
    # customCommand:
    #   command: ["/bin/sh", "-c"]
    #   args:
    #   - "node ./index.js"

  # ---------------------------------------------------
  # ENABLE THIS FOR CUSTOM CA CERTS
  # ---------------------------------------------------
    # extraVolumeMounts:
    #   - name: ca-certs-configmap
    #     mountPath: /etc/custom-certs/custom-ca.crt
    #     subPath: custom-ca.crt
    #     readOnly: true

# ~~~~


# ------------------------------------------------------------------------------
# FORMS CONFIGURATION
# ------------------------------------------------------------------------------

forms:
  configMap:
    enabled: false
    key: forms.yaml
    mountPath: /app/dist/persistent/forms.yaml
    name: ''
  customJs:
    enabled: false
    key: custom.js
    mountPath: /app/dist/src/functions/custom.js
    name: ''
  extraFormsConfigMap:
    enabled: false
    mountPath: /app/dist/persistent/forms
    name: ''

# ------------------------------------------------------------------------------
# ROLLING WHEN THE CONFIGURATION CHANGES
# ------------------------------------------------------------------------------
# A pod reads its configuration once, when it starts. Change the Secret and the
# running process keeps the environment it was given; change the my.cnf
# ConfigMap and the file inside the container does not move at all, because it
# is mounted with subPath and subPath mounts are frozen at pod creation.
#
# Measured on a live release before this existed: the ConfigMap asked for
# innodb_buffer_pool_size 256M, the file in the pod still read "[mysqld]" and
# MySQL was running on the 128M default, with no indication anything was wrong.
#
# With this on, a checksum of what the chart renders goes into the pod template,
# so a configuration change becomes an ordinary rollout.
rollOnChange:
  # The objects the chart renders itself: the generated Secret and the MySQL
  # my.cnf. Always deterministic, since the checksum comes from the templates.
  enabled: true

  # The objects it does not: a Secret supplied through secrets.existingSecret,
  # and the ConfigMaps under `forms` holding forms.yaml, the extra definitions
  # and custom.js. Seeing those means reading them from the cluster, and that
  # returns nothing during `helm template`, so anything rendering first and
  # applying afterwards, Argo CD and Flux included, would get a checksum that
  # does not match the one an install produces.
  #
  # Turn it on if you drive the chart with helm directly and want a forms.yaml
  # change to restart the server on the next upgrade.
  external: false

# ------------------------------------------------------------------------------
# HELM TEST
# ------------------------------------------------------------------------------
# The pod `helm test` runs. It fetches the front page through the Service and
# checks the page is really AnsibleForms rather than something else answering
# 200, then opens a connection to the database. `ct install` runs it in CI after
# every install.
#
# It carries the same security context as the rest of the chart, so it is
# accepted where the restricted Pod Security Standard is enforced. A test pod
# the namespace refuses would fail `helm test` for a reason that has nothing to
# do with the release.
tests:
  enabled: true
  image: curlimages/curl:8.10.1
  # The uid the image already runs as. Change it with the image.
  runAsUser: 100
  runAsGroup: 100
  # The test pod is scheduled like anything else, so on a cluster where the
  # nodes are tainted it needs to be told the same things the other two are.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  imagePullSecrets: []

# ------------------------------------------------------------------------------
# SECRETS
# ------------------------------------------------------------------------------
# By default the chart creates a Secret named <release>-secrets from the values
# above. Point existingSecret at a Secret you manage instead, and the chart will
# not create or touch one: use it with External Secrets, Sealed Secrets, SOPS,
# or anything else that puts credentials in the cluster without them passing
# through values.yaml.
#
# The Secret must carry these five keys:
#   DB_USER, DB_PASSWORD, ENCRYPTION_SECRET, ADMIN_USERNAME, ADMIN_PASSWORD
#
# applications.mysql.password and the sensitive entries under
# applications.server.env can then be left out entirely.
secrets:
  existingSecret: ''

# ------------------------------------------------------------------------------
# INGRESS CONFIGURATION
# ------------------------------------------------------------------------------

ingress:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  className: nginx
  enabled: true
  extraAnnotations: {}
  extraHosts: []
  extraPaths: []
  hostname: <YOUR INGRESS URL>
  path: /
  pathType: Prefix
  tls:
    enabled: true

# ------------------------------------------------------------------------------
# SERVICES CONFIGURATION
# ------------------------------------------------------------------------------

services:
# ~~~~
  mysql:
    type: ClusterIP
    annotations: {}
# ~~~~
  server:
    type: ClusterIP
    # Annotations on the Service, not on the Ingress. Traefik reads its
    # service.* settings from here, which is where you tell it to speak TLS to
    # the backend when applications.server.env.HTTPS is 1:
    #
    #   annotations:
    #     traefik.ingress.kubernetes.io/service.serversscheme: https
    #
    # The application serves a self-signed certificate, so traefik also needs a
    # ServersTransport with insecureSkipVerify, referenced from here:
    #
    #     traefik.ingress.kubernetes.io/service.serverstransport: <ns>-<name>@kubernetescrd
    #
    # On ingress-nginx the equivalent lives on the Ingress instead, as
    # ingress.extraAnnotations:
    #
    #     nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    annotations: {}
# ~~~~

# ------------------------------------------------------------------------------
# STORAGE CONFIGURATION
# ------------------------------------------------------------------------------

storages:
# ~~~~
  mysql:
    className: ''
    size: 10Gi
    # ReadWriteMany is the default the chart has always used. Plenty of storage
    # classes only offer ReadWriteOnce, and with a single replica that is fine.
    accessMode: ReadWriteMany
    static:
      enabled: false
      storageClassName: ''
      volumeName: ''
# ~~~~
  server:
    className: ''
    size: 10Gi
    accessMode: ReadWriteMany
    static:
      enabled: false
      storageClassName: ''
      volumeName: ''
# ~~~~

# ------------------------------------------------------------------------------
# ADD HERE EXTRA VOLUME MOUNTS (if needed) (e.g CUSTOM CA CONFIGMAP or SECRET)
# ------------------------------------------------------------------------------
# extraVolumes:
#   - name: ca-certs-configmap
#     configMap:
#       name: ca-certs-configmap
