---
# kind ships kindnet, which does not enforce NetworkPolicy, so a policy test on
# a default cluster would pass without proving anything. This turns the default
# CNI off so Calico can be installed over it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"
