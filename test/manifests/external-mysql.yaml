---
# A throwaway MySQL for CI, standing in for a database the chart does not
# manage. Deliberately plain: no persistence, no tuning, just somewhere for
# AnsibleForms to connect so the mysql.enabled: false path is exercised for
# real rather than only rendered.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-mysql
  labels:
    app: external-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-mysql
  template:
    metadata:
      labels:
        app: external-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --mysql-native-password=ON
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-root
                  key: password
            - name: MYSQL_ROOT_HOST
              value: "%"
            - name: MYSQL_DATABASE
              value: AnsibleForms
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: external-mysql
spec:
  selector:
    app: external-mysql
  ports:
    - port: 3306
      targetPort: 3306
