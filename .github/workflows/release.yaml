name: Release chart

# Publishing is driven by the version field in Chart.yaml. Bump it in a pull
# request, merge to main, and this workflow tags the release, attaches the
# packaged chart, pushes it to GHCR as an OCI artifact and refreshes the Helm
# repository index served from GitHub Pages.
#
# It waits for CI rather than running beside it. Triggered on push, the two
# raced: the first release went out while the tests were still going, so a red
# build would have published anyway. workflow_run only fires once CI has
# finished, and the job below refuses to do anything unless it finished green.
#
# There is no paths filter any more either. It was the wrong tool: a template
# fix with no version bump published nothing, and touching Chart.yaml without
# changing the version started a release for no reason. The "does this tag
# already exist" check below decides that properly.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-chart
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    # Green CI, and only from a push to main. A pull request whose branch also
    # happens to be called main would otherwise reach this.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: write
      packages: write
    outputs:
      released: ${{ steps.check.outputs.released }}
    steps:
      # workflow_run always runs the workflow file from the default branch and
      # checks out its tip by default, which is not necessarily the commit that
      # was tested. Package what CI actually looked at.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Read chart version
        id: chart
        run: |
          version="$(helm show chart . | awk '/^version:/ {print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Chart version is $version"

      - name: Skip if the tag already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists, nothing to do."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        if: steps.check.outputs.released == 'true'
        run: helm package . --destination dist

      - name: Create GitHub release
        if: steps.check.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "ansibleforms ${VERSION}" \
            --generate-notes \
            "dist/ansibleforms-${VERSION}.tgz"

      # The automatic GITHUB_TOKEN is enough to push to GHCR as long as the job
      # asks for packages: write, so no personal access token is needed here.
      # A package pushed this way is linked to the repository and inherits its
      # visibility, so on a public repository it is publicly pullable straight
      # away with no visit to the package settings.
      - name: Push to GHCR
        if: steps.check.outputs.released == 'true'
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          helm registry login ghcr.io \
            --username '${{ github.actor }}' \
            --password '${{ github.token }}'
          helm push "dist/ansibleforms-${VERSION}.tgz" "oci://ghcr.io/${owner}/charts"

  pages:
    name: Publish Helm repository
    needs: release
    # Also runs on a manual dispatch even when there is no new version, so the
    # index can be rebuilt on its own. Without that, a release whose Pages job
    # failed (say, because the Pages source had not been set yet) could never be
    # republished: the retry would find the tag already there, decide there was
    # nothing to release, and skip this job until the next version bump.
    if: needs.release.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      # Do not bother with the action's `enablement` flag. Creating a Pages site
      # needs repository administration rights, which the automatic token does
      # not have however many permissions the job asks for, and it fails with
      # "Resource not accessible by integration". Turning Pages on is a manual
      # step for whoever owns the repository, once.
      #
      # Until then this job steps aside instead of failing the release: the
      # GitHub release and the OCI artifact are published either way, and a
      # permanently red pipeline just teaches everyone to ignore it.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true

      - name: Explain what is missing
        if: steps.pages.outcome == 'failure'
        run: |
          {
            echo "### Helm repository not published"
            echo
            echo "The chart is released and pushed to GHCR, but the Helm"
            echo "repository index was skipped because GitHub Pages is not"
            echo "set up on this repository."
            echo
            echo "To enable it, an administrator has to open **Settings >"
            echo "Pages** once and set the source to **GitHub Actions**, then"
            echo "re-run this workflow. Nothing else is needed, and no secret"
            echo "is involved."
          } >> "$GITHUB_STEP_SUMMARY"

      # The index is rebuilt from every published release rather than kept as
      # state in a branch, so the site can always be regenerated from scratch.
      - name: Rebuild the repository index
        if: steps.pages.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir -p public
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --dir public --pattern '*.tgz' --clobber || true
          done
          ls -la public
          helm repo index public --url "${PAGE_URL}/"

      - name: Write a landing page
        if: steps.pages.outcome == 'success'
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cat > public/index.html <<EOF
          <!doctype html>
          <meta charset="utf-8">
          <title>AnsibleForms Helm charts</title>
          <h1>AnsibleForms Helm charts</h1>
          <p>Add this repository with:</p>
          <pre>helm repo add ansibleforms ${PAGE_URL}/
          helm repo update
          helm search repo ansibleforms</pre>
          <p>Or pull the chart straight from the OCI registry:</p>
          <pre>helm pull oci://ghcr.io/${{ github.repository_owner }}/charts/ansibleforms</pre>
          <p><a href="index.yaml">index.yaml</a></p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: public

      - uses: actions/deploy-pages@v4
        if: steps.pages.outcome == 'success'
        id: deploy
