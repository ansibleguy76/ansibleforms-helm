name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: "0.6.7"

jobs:
  lint:
    name: Lint and render
    runs-on: ubuntu-latest
    steps:
      # Full history: the version check below reads Chart.yaml from the base
      # branch to see whether the version moved.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: yamllint
        run: |
          pip install --quiet yamllint
          yamllint --strict .

      # Publishing is driven by the version in Chart.yaml, and the release
      # workflow does nothing when the tag already exists. So a pull request that
      # changes a template without bumping the version merges green, publishes
      # nothing, and says nothing: the change sits on main and no one finds out
      # until the next release drags it along.
      - name: The chart version must move when the chart does
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE" HEAD -- Chart.yaml values.yaml templates files)"
          if [ -z "$changed" ]; then
            echo "Nothing under Chart.yaml, values.yaml, templates/ or files/ changed here."
            exit 0
          fi
          echo "Chart files this pull request touches:"
          echo "$changed" | sed 's/^/  /'
          before="$(git show "$BASE:Chart.yaml" | awk '/^version:/ {print $2}')"
          after="$(awk '/^version:/ {print $2}' Chart.yaml)"
          echo "base branch: $before"
          echo "this branch: $after"
          if [ "$before" = "$after" ]; then
            echo "::error::The chart changed but Chart.yaml still says $after. Bump it, or the merge publishes nothing at all."
            exit 1
          fi
          if gh release view "v${after}" >/dev/null 2>&1; then
            echo "::error::v${after} is already released. Pick a version that has not been published, or the release job will skip this one."
            exit 1
          fi
          echo "Version moved from $before to $after and $after is unreleased."

      # Rendering with nothing but the defaults has to FAIL: values.yaml ships
      # placeholder credentials, and writing <ENTER_PASSWORD_HERE> into a real
      # Secret is never what anyone meant. This asserts the guard is still there.
      - name: Refuse to render the placeholder credentials
        run: |
          if helm template guard-check . >/dev/null 2>&1; then
            echo "::error::The chart rendered with the placeholder credentials still in place."
            exit 1
          fi
          helm template guard-check . 2>&1 | grep -q "secrets.existingSecret" || {
            echo "::error::It failed, but not with the message that tells people how to fix it."
            helm template guard-check . 2>&1 | tail -5
            exit 1
          }
          echo "Placeholder credentials are refused, with a message pointing at the fix."

      - name: helm lint
        run: |
          for f in ci/*-values.yaml test/values/*-values.yaml; do
            echo "::group::helm lint with $f"
            helm lint . --strict --values "$f"
            echo "::endgroup::"
          done

      # The Service moves to 443 when applications.server.env.HTTPS is 1, and the
      # Ingress backend used to say 80 regardless, so with HTTPS on the Ingress
      # pointed at a port the Service did not expose and every request came back
      # 503. They are tied together by port name now.
      #
      # This resolves the backend the way an ingress controller does, following
      # the Service name and then the port, so it stays honest whether the
      # backend is written as a name or as a number.
      # PyYAML is already here, it comes in with yamllint above.
      - name: The Ingress backend must resolve to a port the Service publishes
        run: |
          set -euo pipefail
          for f in ci/default-values.yaml test/values/https-values.yaml; do
            echo "::group::ingress backend with $f"
            helm template portcheck . --values "$f" > /tmp/portcheck.yaml
            python3 - <<'PY'
          import sys, yaml

          docs = [d for d in yaml.safe_load_all(open("/tmp/portcheck.yaml")) if d]
          ingresses = [d for d in docs if d["kind"] == "Ingress"]
          if not ingresses:
              sys.exit("::error::No Ingress was rendered, so this proves nothing.")

          services = {d["metadata"]["name"]: d for d in docs if d["kind"] == "Service"}

          for ing in ingresses:
              for rule in ing["spec"]["rules"]:
                  for path in rule["http"]["paths"]:
                      backend = path["backend"]["service"]
                      name, port = backend["name"], backend["port"]
                      svc = services.get(name)
                      if svc is None:
                          sys.exit(f"::error::Ingress points at Service {name!r}, "
                                   f"which the chart does not render. "
                                   f"It renders {sorted(services)}.")
                      published = svc["spec"]["ports"]
                      by_name = {p["name"]: p["port"] for p in published if p.get("name")}
                      by_number = {p["port"] for p in published}
                      if "name" in port:
                          ok = port["name"] in by_name
                      else:
                          ok = port["number"] in by_number
                      print(f"{name} backend {port} against published {published}: "
                            f"{'ok' if ok else 'BROKEN'}")
                      if not ok:
                          sys.exit(f"::error::Ingress asks {name} for {port}, but that "
                                   f"Service publishes {sorted(by_number)} "
                                   f"(named {sorted(by_name)}).")
          print("Every Ingress backend resolves to a port its Service publishes.")
          PY
            echo "::endgroup::"
          done

      # Scheduling is pass-through: whatever goes into the values file has to
      # come out in the pod spec, unchanged and in the right place. kubeconform
      # already rejects a block indented into the wrong parent, since the stray
      # keys show up as additionalProperties, but it cannot notice a field that
      # was quietly dropped because the template never referenced it. This
      # compares the two sides directly.
      - name: Scheduling values must reach both pod specs
        run: |
          set -euo pipefail
          helm template sched . --values test/values/scheduling-values.yaml > /tmp/sched.yaml
          python3 - <<'PY'
          import sys, yaml

          values = yaml.safe_load(open("test/values/scheduling-values.yaml"))
          docs = [d for d in yaml.safe_load_all(open("/tmp/sched.yaml")) if d]
          pods = {d["metadata"]["name"]: d["spec"]["template"]
                  for d in docs if d["kind"] == "Deployment"}

          FIELDS = ["nodeSelector", "tolerations", "affinity",
                    "topologySpreadConstraints", "priorityClassName",
                    "serviceAccountName"]
          failures = []

          for comp, name in (("server", "sched-server"), ("mysql", "sched-mysql")):
              cfg = values["containers"][comp]
              spec = pods[name]["spec"]

              for field in FIELDS:
                  want = cfg.get(field)
                  if not want:
                      continue
                  got = spec.get(field)
                  if got != want:
                      failures.append(f"{name}: {field} is {got!r}, values asked for {want!r}")

              # imagePullSecrets falls back to the release wide list
              want = cfg.get("imagePullSecrets") or values.get("imagePullSecrets")
              if want and spec.get("imagePullSecrets") != want:
                  failures.append(f"{name}: imagePullSecrets is "
                                  f"{spec.get('imagePullSecrets')!r}, expected {want!r}")

              # podLabels and commonLabels both land on the pod, never on the selector
              labels = pods[name]["metadata"]["labels"]
              for k, v in (cfg.get("podLabels") or {}).items():
                  if labels.get(k) != v:
                      failures.append(f"{name}: podLabel {k}={v} missing from the pod")
              for k, v in (values.get("commonLabels") or {}).items():
                  if labels.get(k) != str(v):
                      failures.append(f"{name}: commonLabel {k}={v} missing from the pod")

              ann = pods[name]["metadata"].get("annotations") or {}
              for k, v in (values.get("commonAnnotations") or {}).items():
                  if ann.get(k) != v:
                      failures.append(f"{name}: commonAnnotation {k} missing from the pod")

          # A Deployment selector is immutable. A commonLabel landing there would
          # make the chart impossible to upgrade, so this one is not negotiable.
          for d in docs:
              if d["kind"] != "Deployment":
                  continue
              sel = d["spec"]["selector"]["matchLabels"]
              for k in list(values.get("commonLabels") or {}) + ["role"]:
                  if k in sel:
                      failures.append(f"{d['metadata']['name']}: {k!r} reached the "
                                      f"selector, which is immutable")

          # commonLabels and commonAnnotations reach every object, not just the pods
          for d in docs:
              where = f"{d['kind']}/{d['metadata']['name']}"
              labels = d["metadata"].get("labels") or {}
              ann = d["metadata"].get("annotations") or {}
              for k, v in (values.get("commonLabels") or {}).items():
                  if labels.get(k) != str(v):
                      failures.append(f"{where}: commonLabel {k} missing")
              for k in (values.get("commonAnnotations") or {}):
                  if k not in ann:
                      failures.append(f"{where}: commonAnnotation {k} missing")

          if failures:
              print("\n".join(failures))
              sys.exit("::error::Scheduling or common metadata did not survive rendering.")
          print(f"Checked {len(FIELDS) + 1} fields on both pods and common metadata "
                f"on all {len(docs)} objects.")
          PY

      # MySQL had no probes at all, so the Service advertised an endpoint the
      # moment the container started, long before the server accepted a
      # connection. The three probes below all run mysqladmin ping, which needs
      # no credentials: it answers "access denied" well before it would answer a
      # query, and that is the signal wanted. Assert both halves of that, since
      # the obvious way to write this probe puts the root password on a command
      # line where every ps in the container can read it.
      - name: MySQL probes exist and carry no credentials
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, re, subprocess, sys, yaml

          failures = []
          for values in sorted(glob.glob("ci/*-values.yaml") + glob.glob("test/values/*-values.yaml")):
              out = subprocess.run(
                  ["helm", "template", "probecheck", ".", "--values", values],
                  capture_output=True, text=True, check=True).stdout
              docs = [d for d in yaml.safe_load_all(out) if d]
              mysql = [d for d in docs
                       if d["kind"] == "Deployment"
                       and d["metadata"]["name"] == "probecheck-mysql"]
              if not mysql:
                  print(f"{values}: no bundled MySQL, skipped")
                  continue

              container = mysql[0]["spec"]["template"]["spec"]["containers"][0]
              cfg = (yaml.safe_load(open(values)) or {}).get("containers", {}).get("mysql") or {}

              for probe in ("startupProbe", "readinessProbe", "livenessProbe"):
                  key = probe.replace("Probe", "")
                  wanted = (cfg.get(key) or {}).get("enabled", True)
                  present = probe in container
                  if wanted and not present:
                      failures.append(f"{values}: {probe} is missing")
                  if not wanted and present:
                      failures.append(f"{values}: {probe} is set but values disabled it")
                  if not present:
                      continue
                  command = " ".join(container[probe]["exec"]["command"])
                  # -pSECRET or --password=..., and any expansion of the two env
                  # vars holding the root password. The negative lookbehind is
                  # what keeps --protocol=TCP from matching -p.
                  if re.search(r"(?<!-)-p\S|--password|\$\{?(MYSQL_ROOT_PASSWORD|DB_PASSWORD)",
                               command):
                      failures.append(f"{values}: {probe} command looks like it "
                                      f"passes a credential: {command!r}")
              print(f"{values}: probes ok")

          if failures:
              print("\n".join(failures))
              sys.exit("::error::MySQL probes are wrong.")
          PY

      - name: Install kubeconform
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      # Rendering against several Kubernetes versions catches removed or renamed
      # API versions long before anyone upgrades a cluster. The rendered output
      # is linted too: Helm templates cannot be parsed as YAML directly, so a
      # duplicated key only shows up once the templates have been expanded.
      - name: helm template and kubeconform
        run: |
          mkdir -p rendered
          for f in ci/*-values.yaml test/values/*-values.yaml; do
            name="$(basename "$f" -values.yaml)"
            for kube in 1.29.0 1.31.0 1.33.0; do
              echo "::group::$name on Kubernetes $kube"
              helm template ansibleforms . \
                --values "$f" \
                --kube-version "$kube" \
                > "rendered/${name}-${kube}.yaml"
              # Only the structural rules matter here. Whitespace and layout are
              # whatever the templates produced, and ConfigMap payloads legitimately
              # carry trailing spaces. What this catches is duplicate keys, which is
              # how a merge once turned one PVC template into two half-merged copies.
              yamllint --strict -d '{extends: default, rules: {key-duplicates: enable, line-length: disable, empty-lines: disable, indentation: disable, comments: disable, comments-indentation: disable, document-start: disable, truthy: disable, braces: disable, trailing-spaces: disable, new-line-at-end-of-file: disable, empty-values: disable}}' \
                "rendered/${name}-${kube}.yaml"
              kubeconform \
                -strict \
                -summary \
                -kubernetes-version "$kube" \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                "rendered/${name}-${kube}.yaml"
              echo "::endgroup::"
            done
          done

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered/
          retention-days: 7

  install:
    name: Install on kind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: helm/chart-testing-action@v2

      - uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.31.0

      # ct installs the chart once per ci/*-values.yaml file and waits for every
      # pod to become ready, so a broken probe or a bad default fails here.
      - name: ct install
        run: ct install --config ct.yaml --charts .

      # ct can only install what a values file alone describes, and these two
      # need something in the cluster first, so they are driven by hand. They
      # are worth the extra minutes: between them they cover the two ways a
      # deployment stops being self-contained.
      - name: Install against a Secret managed outside the chart
        run: |
          kubectl create namespace existing-secret
          kubectl -n existing-secret create secret generic ansibleforms-credentials \
            --from-literal=DB_USER=root \
            --from-literal=DB_PASSWORD=ci-not-a-real-password \
            --from-literal=ENCRYPTION_SECRET=ci-not-a-real-secret \
            --from-literal=ADMIN_USERNAME=admin \
            --from-literal=ADMIN_PASSWORD=ci-not-a-real-password
          helm install existing-secret . \
            --namespace existing-secret \
            --values test/values/existing-secret-values.yaml \
            --wait --timeout 12m
          # The chart must not have created one of its own alongside it.
          if kubectl -n existing-secret get secret existing-secret-secrets >/dev/null 2>&1; then
            echo "::error::The chart generated a Secret even though existingSecret was set."
            exit 1
          fi
          kubectl -n existing-secret get pods
          helm uninstall existing-secret --namespace existing-secret

      - name: Install against a database the chart does not manage
        run: |
          kubectl create namespace external-db
          kubectl -n external-db create secret generic mysql-root \
            --from-literal=password=ci-not-a-real-password
          kubectl -n external-db apply -f test/manifests/external-mysql.yaml
          kubectl -n external-db rollout status deployment/external-mysql --timeout=8m
          # Belt and braces on top of the probe: wait until the server really
          # answers over TCP before touching it.
          for i in $(seq 1 60); do
            if kubectl -n external-db exec deployment/external-mysql -- \
                 sh -c 'mysqladmin ping -h 127.0.0.1 --protocol=TCP -uroot -p"$MYSQL_ROOT_PASSWORD" --silent' >/dev/null 2>&1; then
              echo "MySQL is accepting connections."
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::The external MySQL never came up."
              kubectl -n external-db logs deployment/external-mysql --tail=50
              exit 1
            fi
            sleep 5
          done
          # A database the chart does not manage never sees the init script, and
          # AnsibleForms migrates an existing schema forward rather than creating
          # one, so the schema goes in first. This is exactly what the README
          # tells operators to do, so the test does it the same way.
          kubectl -n external-db exec -i deployment/external-mysql -- \
            sh -c 'mysql -h 127.0.0.1 --protocol=TCP -uroot -p"$MYSQL_ROOT_PASSWORD"' < files/schema.sql
          helm install external-db . \
            --namespace external-db \
            --values test/values/external-db-values.yaml \
            --set applications.mysql.host=external-mysql.external-db.svc.cluster.local \
            --set applications.mysql.user=root \
            --wait --timeout 12m
          # Nothing MySQL-shaped should have come from the chart.
          for kind in deployment/external-db-mysql service/external-db-mysql pvc/external-db-mysql-pvc; do
            if kubectl -n external-db get "$kind" >/dev/null 2>&1; then
              echo "::error::The chart created $kind with mysql.enabled set to false."
              exit 1
            fi
          done
          kubectl -n external-db get pods
          # Ready is not enough here: the home page is static, so the pod comes
          # up and answers even when every query underneath is failing. Look at
          # what the application actually said instead.
          if kubectl -n external-db logs deployment/external-db-server -c server | grep -q "doesn't exist"; then
            echo "::error::The server is up but its tables are missing."
            kubectl -n external-db logs deployment/external-db-server -c server | grep "doesn't exist" | head -5
            exit 1
          fi
          helm uninstall external-db --namespace external-db

      # Every Deployment, Service and ConfigMap used to be named with a plain
      # literal, so a second release in the same namespace overwrote the first
      # and each Service selected the other one's pods. Install two and check
      # they stay apart.
      - name: Two releases side by side in one namespace
        run: |
          kubectl create namespace side-by-side
          for rel in blue green; do
            helm install "$rel" . \
              --namespace side-by-side \
              --values ci/no-ingress-values.yaml \
              --wait --timeout 12m
          done
          kubectl -n side-by-side get all
          for rel in blue green; do
            for kind in deployment/${rel}-server deployment/${rel}-mysql \
                        service/${rel}-server service/${rel}-mysql \
                        secret/${rel}-secrets pvc/${rel}-server-pvc pvc/${rel}-mysql-pvc; do
              kubectl -n side-by-side get "$kind" >/dev/null || {
                echo "::error::$kind is missing, the two releases collided."
                exit 1
              }
            done
            # The Service must resolve to its own release's pod and nobody else's.
            # EndpointSlice rather than Endpoints, which is deprecated from 1.33.
            eps="$(kubectl -n side-by-side get endpointslices \
                     -l "kubernetes.io/service-name=${rel}-server" \
                     -o jsonpath='{.items[*].endpoints[*].targetRef.name}')"
            echo "${rel}-server endpoints: $eps"
            count="$(printf '%s' "$eps" | wc -w)"
            if [ "$count" != "1" ]; then
              echo "::error::${rel}-server selects $count pods, expected exactly 1."
              exit 1
            fi
            case "$eps" in
              ${rel}-server-*) ;;
              *) echo "::error::${rel}-server selects $eps, which belongs to the other release."; exit 1 ;;
            esac
          done
          echo "The two releases are fully independent."
          helm uninstall blue green --namespace side-by-side

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods --all-namespaces
          kubectl describe pods --all-namespaces
          kubectl logs --all-containers --tail=200 --selector app.kubernetes.io/component=server --all-namespaces || true
          kubectl logs --all-containers --tail=200 --selector app.kubernetes.io/component=database --all-namespaces || true

  # Every release so far has been an upgrade risk, and nothing here ever ran
  # helm upgrade: the whole suite installs from scratch. A chart that renames a
  # PersistentVolumeClaim passes every other check in this file while quietly
  # provisioning an empty volume and deleting the one holding the data.
  upgrade:
    name: Upgrade a live release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.31.0

      - name: Install the published chart, put data in it, then upgrade to this one
        run: |
          set -euo pipefail

          NS=upgrade
          helm repo add ansibleforms https://ansibleguy76.github.io/ansibleforms-helm/ >/dev/null
          helm repo update >/dev/null

          # The newest version on the chart repository, which is whatever main published
          # last. The version in Chart.yaml on this branch is not there yet.
          PREV="$(helm search repo ansibleforms/ansibleforms -o json |
                  python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["version"])')"
          HERE="$(helm show chart . | awk '/^version:/ {print $2}')"
          echo "Upgrading a live $PREV release to $HERE"

          kubectl create namespace "$NS"
          helm install upg ansibleforms/ansibleforms --version "$PREV" \
            --namespace "$NS" --values ci/no-ingress-values.yaml --wait --timeout 12m

          MYSQL="$(kubectl -n "$NS" get deploy -l app.kubernetes.io/component=database -o name | head -1)"
          SERVER="$(kubectl -n "$NS" get deploy -l app.kubernetes.io/component=server -o name | head -1)"
          echo "Found $MYSQL and $SERVER"

          # Something in the database and something on the server's volume, so the check
          # afterwards is about data rather than about objects existing.
          kubectl -n "$NS" exec "$MYSQL" -- sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -e "
            USE AnsibleForms;
            CREATE TABLE IF NOT EXISTS upgrade_marker (note varchar(64));
            DELETE FROM upgrade_marker;
            INSERT INTO upgrade_marker VALUES (\"written-before-the-upgrade\");"'
          kubectl -n "$NS" exec "$SERVER" -c server -- \
            sh -c 'echo written-before-the-upgrade > /app/dist/persistent/upgrade-marker.txt'

          kubectl -n "$NS" get pvc -o json > /tmp/pvc-before.json

          helm upgrade upg . --namespace "$NS" --values ci/no-ingress-values.yaml --wait --timeout 12m

          kubectl -n "$NS" get pvc -o json > /tmp/pvc-after.json

          # The claims have to be the same claims bound to the same volumes. A renamed PVC
          # does not move a volume, it provisions an empty one and deletes the old, and
          # every check below this line would still pass while the data was gone.
          python3 - <<'PY'
          import json, sys

          def claims(path):
              return {i["metadata"]["name"]: i["spec"]["volumeName"]
                      for i in json.load(open(path))["items"]}

          before, after = claims("/tmp/pvc-before.json"), claims("/tmp/pvc-after.json")
          print("before:", before)
          print("after :", after)
          if before != after:
              lost = {k: v for k, v in before.items() if after.get(k) != v}
              sys.exit(f"::error::The upgrade moved storage. These claims changed or "
                       f"disappeared: {lost}. A renamed or reprovisioned claim is an empty "
                       f"volume with the old one deleted underneath it.")
          print("Every claim still points at the volume it pointed at before.")
          PY

          MYSQL="$(kubectl -n "$NS" get deploy -l app.kubernetes.io/component=database -o name | head -1)"
          SERVER="$(kubectl -n "$NS" get deploy -l app.kubernetes.io/component=server -o name | head -1)"

          row="$(kubectl -n "$NS" exec "$MYSQL" -- sh -c \
            'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "USE AnsibleForms; SELECT note FROM upgrade_marker;"' \
            2>/dev/null | tr -d '\r')"
          [ "$row" = "written-before-the-upgrade" ] || {
            echo "::error::The row written before the upgrade is gone. Got: '$row'"; exit 1; }

          file="$(kubectl -n "$NS" exec "$SERVER" -c server -- \
            cat /app/dist/persistent/upgrade-marker.txt 2>/dev/null | tr -d '\r')"
          [ "$file" = "written-before-the-upgrade" ] || {
            echo "::error::The file written before the upgrade is gone. Got: '$file'"; exit 1; }

          # And it still works afterwards, not merely survives
          svc="$(kubectl -n "$NS" get svc -l app.kubernetes.io/component=server -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n "$NS" run curl-upgrade --rm -i --restart=Never --image=curlimages/curl:8.10.1 --quiet -- \
            curl -sf -o /dev/null "http://${svc}.${NS}.svc.cluster.local/" || {
            echo "::error::The application does not answer after the upgrade."; exit 1; }

          echo "Data and storage survived the upgrade from $PREV to $HERE, and the app answers."


      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n upgrade get all,pvc || true
          kubectl -n upgrade describe pods || true
          kubectl -n upgrade logs --all-containers --tail=200 \
            --selector app.kubernetes.io/component=server || true

  # kind has no ingress controller, so until now the Ingress was rendered,
  # validated against the schema and never asked for a single page. The port bug
  # fixed in 6.2.2 lived exactly there: a manifest that validates perfectly and
  # that no controller can route.
  ingress:
    name: Route through a real ingress controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - uses: helm/kind-action@v1
        with:
          node_image: kindest/node:v1.31.0

      # ClusterIP and a port-forward rather than the kind specific hostPort
      # deployment, so this needs nothing special from the cluster. The
      # admission webhook is off because it adds a minute and catches nothing
      # that helm lint has not already.
      - name: Install ingress-nginx
        run: |
          set -euo pipefail
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo update
          helm install ingress-nginx ingress-nginx/ingress-nginx \
            --namespace ingress-nginx --create-namespace \
            --set controller.service.type=ClusterIP \
            --set controller.admissionWebhooks.enabled=false \
            --set controller.watchIngressWithoutClass=true \
            --wait --timeout 8m

      - name: Ask for the page, plain and with the application terminating TLS
        run: |
          set -euo pipefail

          check() {
            ns="$1"; values="$2"; host="$3"
            echo "::group::$values through a real ingress-nginx"
            kubectl create namespace "$ns"
            helm install ing . --namespace "$ns" --values "$values" --wait --timeout 12m >/dev/null

            kubectl -n "$ns" get ingress -o jsonpath='{range .items[*]}  backend: {.spec.rules[0].http.paths[0].backend.service}{"\n"}{end}'
            kubectl -n "$ns" get svc -l app.kubernetes.io/component=server -o jsonpath='{range .items[*]}  service: {.spec.ports}{"\n"}{end}'

            # The controller needs a moment to pick the Ingress up and reload
            for i in $(seq 1 30); do
              code="$(curl -s -o /dev/null -w '%{http_code}' -H "Host: $host" \
                        --max-time 10 http://127.0.0.1:8080/ || echo 000)"
              [ "$code" = "200" ] && break
              sleep 4
            done

            body="$(curl -s -H "Host: $host" --max-time 10 http://127.0.0.1:8080/ || true)"
            echo "  HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::$values is not reachable through the ingress, got $code."
              kubectl -n "$ns" get ingress,svc,endpointslices
              kubectl -n ingress-nginx logs deployment/ingress-nginx-controller --tail=40
              exit 1
            fi
            case "$body" in
              *"Ansible Forms"*) echo "  the page served is AnsibleForms" ;;
              *) echo "::error::Something answered 200 but it was not the application."; exit 1 ;;
            esac
            helm uninstall ing --namespace "$ns" >/dev/null
            kubectl delete namespace "$ns" --wait=false >/dev/null
            echo "::endgroup::"
          }

          kubectl -n ingress-nginx port-forward svc/ingress-nginx-controller 8080:80 >/dev/null 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          sleep 3

          check ing-http  test/values/ingress-http-values.yaml  ansibleforms.ci.example.com
          check ing-https test/values/ingress-https-values.yaml ansibleforms.ci.example.com
          echo "Both the plain and the TLS backend answer through a real ingress controller."


      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get ingress -A || true
          kubectl -n ingress-nginx logs deployment/ingress-nginx-controller --tail=100 || true
