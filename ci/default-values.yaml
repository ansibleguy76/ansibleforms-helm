---
# Baseline install used by CI: HTTP, bundled MySQL, ingress enabled.
# Resources are trimmed down so the release fits on a GitHub runner.
applications:
  mysql:
    password: ci-not-a-real-password
    user: root
  server:
    env:
      HTTPS: 0
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-not-a-real-password
      ENCRYPTION_SECRET: ci-not-a-real-secret

containers:
  mysql:
    resources:
      limits:
        cpu: '1'
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 256Mi
  server:
    resources:
      limits:
        cpu: '1'
        memory: 1024Mi
      requests:
        cpu: 100m
        memory: 256Mi

ingress:
  enabled: true
  hostname: ansibleforms.ci.example.com
  tls:
    enabled: false

storages:
  # The local-path provisioner that ships with kind only does ReadWriteOnce,
  # so the install job doubles as a check that this value actually works.
  mysql:
    size: 1Gi
    accessMode: ReadWriteOnce
  server:
    size: 1Gi
    accessMode: ReadWriteOnce
